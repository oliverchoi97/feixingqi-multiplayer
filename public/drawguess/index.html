<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>猜猜畫畫 · Gaming In My Life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/portal.css" />
    <link rel="stylesheet" href="/css/danmaku.css" />
    <link rel="stylesheet" href="/css/boards.css" />
    <link rel="stylesheet" href="/css/session.css" />
    <link rel="stylesheet" href="/css/bgm.css" />
  </head>
  <body>
    <div id="toast" hidden></div>
    <section id="screen-home" class="screen">
      <div class="home-card">
        <nav class="site-nav" style="width:100%;margin:0 0 12px">
          <a href="/">遊戲選單</a>
          <a href="/feixingqi">飛行棋</a>
        </nav>
        <p class="eyebrow">你畫我猜</p>
        <h1>猜猜畫畫</h1>
        <p class="lede">一人作畫、其他人猜詞。2 到 6 人連線，沒有電腦。畫布即時同步。</p>
        <label class="field">
          <span>暱稱</span>
          <input id="nickname" maxlength="12" placeholder="怎麼稱呼你" autocomplete="nickname" />
        </label>
        <div class="home-actions">
          <button id="btn-create" class="btn primary" type="button">建立房間</button>
          <div class="join-row">
            <input id="join-code" maxlength="4" placeholder="房間代碼" autocomplete="off" spellcheck="false" />
            <button id="btn-join" class="btn" type="button">加入</button>
          </div>
        </div>
        <div class="session-strip">
          <button type="button" class="btn ghost" data-session="end">結束遊戲</button>
          <button type="button" class="btn ghost" data-session="menu">回到主選單</button>
        </div>
        <p class="hint">畫家看到題目並作畫；其他人在猜題欄輸入。猜中畫家加 1 分、猜中者加 2 分，然後換人。</p>
      </div>
    </section>
    <section id="screen-lobby" class="screen" hidden>
      <div class="lobby-card">
        <header class="lobby-head">
          <div>
            <p class="eyebrow">候機室</p>
            <h2>房間 <span id="lobby-code">----</span></h2>
          </div>
          <div class="lobby-share">
            <button id="btn-copy" class="btn ghost" type="button">複製連結</button>
            <button id="btn-leave" class="btn ghost" type="button">離開</button>
          </div>
        </header>
        <p class="lede tight" id="lobby-status">至少兩人準備後開局。</p>
        <div id="lobby-seats" class="seats"></div>
        <div class="lobby-actions">
          <button id="btn-ready" class="btn primary" type="button">準備</button>
          <button id="btn-start" class="btn" type="button" hidden>開始遊戲</button>
        </div>
        <div class="session-strip">
          <button type="button" class="btn ghost" data-session="end">結束遊戲</button>
          <button type="button" class="btn ghost" data-session="menu">回到主選單</button>
        </div>
      </div>
    </section>
    <section id="screen-play" class="screen table-screen" hidden>
      <div class="table-play">
        <aside class="panel">
          <div class="panel-top">
            <div>
              <p class="eyebrow">房間</p>
              <strong id="game-code" class="mono">----</strong>
            </div>
            <div id="turn-banner" class="turn-banner">開局</div>
          </div>
          <div id="player-list" class="player-list"></div>
          <div id="guess-row" class="join-row" hidden>
            <input id="guess-input" maxlength="16" placeholder="猜這個詞" autocomplete="off" />
            <button id="btn-guess" class="btn primary" type="button">猜</button>
          </div>
          <div class="session-strip">
            <button type="button" class="btn ghost" data-session="end">結束遊戲</button>
            <button type="button" class="btn ghost" data-session="menu">回到主選單</button>
          </div>
        </aside>
        <div class="draw-wrap">
          <canvas id="draw" width="720" height="540"></canvas>
          <div id="draw-tools" class="draw-tools" hidden>
            <button type="button" class="swatch-btn on" data-color="#2a1f14" style="background:#2a1f14" aria-label="黑"></button>
            <button type="button" class="swatch-btn" data-color="#9c1c1c" style="background:#9c1c1c" aria-label="紅"></button>
            <button type="button" class="swatch-btn" data-color="#1a4fd8" style="background:#1a4fd8" aria-label="藍"></button>
            <button type="button" class="swatch-btn" data-color="#1f8a3a" style="background:#1f8a3a" aria-label="綠"></button>
            <button type="button" class="swatch-btn" data-color="#c9a227" style="background:#c9a227" aria-label="金"></button>
            <button type="button" class="swatch-btn" data-color="#ffffff" style="background:#fff" aria-label="擦"></button>
            <button id="btn-clear" class="btn ghost" type="button">清空</button>
          </div>
        </div>
      </div>
    </section>
    <div id="winner-modal" class="modal" hidden>
      <div class="modal-card winner">
        <p class="eyebrow">結果</p>
        <h3 id="winner-title">本局結束</h3>
        <button type="button" class="btn primary" data-session="end">回到候機室</button>
      </div>
    </div>
    <div id="danmaku-layer" class="danmaku-layer" aria-hidden="true"></div>
    <form id="chat-bar" class="chat-bar" hidden>
      <label for="chat-input">聊天</label>
      <input id="chat-input" maxlength="72" placeholder="彈幕… /song 歌名" autocomplete="off" />
      <button class="btn primary" type="submit">發送</button>
    </form>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/draw-client.js"></script>
    <script type="module" src="/js/bgm.js"></script>
  </body>
</html>
