<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Gaming In My Life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/portal.css" />
  </head>
  <body>
    <section class="screen portal-screen">
      <div class="portal">
        <p class="eyebrow">GAMING IN MY LIFE</p>
        <h1>選遊戲</h1>
        <p class="lede">在瀏覽器裡跟朋友連線玩。飛行棋四人同場，踩地雷可單人練習或雙人競速。</p>
        <div class="game-cards">
          <a class="game-card" href="/feixingqi">
            <span class="game-card-kicker">多人 · 最多 4 人</span>
            <strong>飛行棋</strong>
            <span>經典十字盤、同色跳格、虛線飛航。空位由電腦補齊。</span>
          </a>
          <a class="game-card" href="/minesweeper">
            <span class="game-card-kicker">單人 / 雙人競賽</span>
            <strong>踩地雷</strong>
            <span>初級到高級，或兩人同圖競速清盤。</span>
          </a>
        </div>
        <p class="hint">公開網址：gaminginmylife.onrender.com</p>
      </div>
    </section>
  </body>
</html>
