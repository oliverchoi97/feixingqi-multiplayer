<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>估數字 · Gaming In My Life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/portal.css" />
    <link rel="stylesheet" href="/css/danmaku.css" />
    <link rel="stylesheet" href="/css/boards.css" />
    <link rel="stylesheet" href="/css/party.css" />
    <link rel="stylesheet" href="/css/session.css" />
    <link rel="stylesheet" href="/css/bgm.css" />
  </head>
  <body data-kind="oneatwob" data-path="/oneatwob">
    <div id="toast" hidden></div>
    <section id="screen-home" class="screen">
      <div class="home-card">
        <nav class="site-nav" style="width:100%;margin:0 0 12px">
          <a href="/">遊戲選單</a>
          <a href="/feixingqi">飛行棋</a>
        </nav>
        <p class="eyebrow">1A2B</p>
        <h1>估數字</h1>
        <p class="lede">系統出四位不重複數字，輪流猜。A 是位置對，B 是數字對但位置不對。先 4A 者勝。2–4 人，一人也可對電腦。</p>
        <label class="field"><span>暱稱</span><input id="nickname" maxlength="12" placeholder="怎麼稱呼你" autocomplete="nickname" /></label>
        <div class="home-actions">
          <button id="btn-create" class="btn primary" type="button">建立房間</button>
          <div class="join-row">
            <input id="join-code" maxlength="4" placeholder="房間代碼" autocomplete="off" spellcheck="false" />
            <button id="btn-join" class="btn" type="button">加入</button>
          </div>
        </div>
        <div class="session-strip">
          <button type="button" class="btn ghost" data-session="end">結束遊戲</button>
          <button type="button" class="btn ghost" data-session="menu">回到主選單</button>
        </div>
        <p class="hint">例如秘密 1234，猜 1356 得 1A1B。</p>
      </div>
    </section>
    <section id="screen-lobby" class="screen" hidden>
      <div class="lobby-card">
        <header class="lobby-head">
          <div>
            <p class="eyebrow">候機室</p>
            <h2>房間 <span id="lobby-code">----</span></h2>
          </div>
          <div class="lobby-share">
            <button id="btn-copy" class="btn ghost" type="button">複製連結</button>
            <button id="btn-leave" class="btn ghost" type="button">離開</button>
          </div>
        </header>
        <p class="lede tight" id="lobby-status">等人進來就可以開。</p>
        <div id="lobby-seats" class="seats"></div>
        <div class="lobby-actions">
          <button id="btn-ready" class="btn primary" type="button">準備</button>
          <button id="btn-start" class="btn" type="button" hidden>開始遊戲</button>
        </div>
        <div class="session-strip">
          <button type="button" class="btn ghost" data-session="end">結束遊戲</button>
          <button type="button" class="btn ghost" data-session="menu">回到主選單</button>
        </div>
      </div>
    </section>
    <section id="screen-play" class="screen table-screen" hidden>
      <div class="table-play">
        <aside class="panel">
          <div class="panel-top">
            <div>
              <p class="eyebrow">房間</p>
              <strong id="game-code" class="mono">----</strong>
            </div>
            <div id="turn-banner" class="turn-banner">開局</div>
          </div>
          <p id="clock" class="last-roll" hidden></p>
          <div id="player-list" class="player-list"></div>
          <p id="play-event" class="hint"></p>
          <div class="session-strip">
            <button type="button" class="btn ghost" data-session="end">結束遊戲</button>
            <button type="button" class="btn ghost" data-session="menu">回到主選單</button>
          </div>
        </aside>
        <div>
          <div id="panel-1a2b" hidden>
            <div id="set-row-1a2b" class="join-row" hidden>
              <input id="secret-input" maxlength="4" inputmode="numeric" placeholder="四位不重複數字" autocomplete="off" />
              <button id="btn-set-secret" class="btn primary" type="button">鎖定密碼</button>
              <button id="btn-random-secret" class="btn" type="button">隨機</button>
            </div>
            <div id="guess-row-1a2b" class="join-row" hidden>
              <input id="guess-input" maxlength="4" inputmode="numeric" placeholder="四位數字" autocomplete="off" />
              <button id="btn-guess" class="btn primary" type="button">猜</button>
            </div>
            <ol id="history-1a2b" class="history-list"></ol>
          </div>
          <div id="panel-sea" hidden>
            <button id="btn-random-fleet" class="btn primary" type="button">隨機佈署並鎖定</button>
            <p class="eyebrow">己方</p>
            <div id="sea-own" class="sea-grid"></div>
            <p class="eyebrow">敵方（點格開火）</p>
            <div id="sea-foe" class="sea-grid"></div>
          </div>
          <div id="panel-slap" hidden>
            <div id="pile-card" class="pile-card">空</div>
            <p id="hand-count" class="hint"></p>
            <button id="btn-play-card" class="btn primary wide" type="button">出牌</button>
            <button id="btn-slap" class="btn wide" type="button">冚！</button>
          </div>
          <div id="panel-maid" hidden>
            <div id="maid-hand"></div>
            <button id="btn-draw" class="btn primary wide" type="button">抽左邊一張</button>
          </div>
        </div>
      </div>
    </section>
    <div id="winner-modal" class="modal" hidden>
      <div class="modal-card winner">
        <p class="eyebrow">結果</p>
        <h3 id="winner-title">本局結束</h3>
        <button type="button" class="btn primary" data-session="end">回到候機室</button>
      </div>
    </div>
    <div id="danmaku-layer" class="danmaku-layer" aria-hidden="true"></div>
    <form id="chat-bar" class="chat-bar" hidden>
      <label for="chat-input">聊天</label>
      <input id="chat-input" maxlength="72" placeholder="彈幕… /song 歌名" autocomplete="off" />
      <button class="btn primary" type="submit">發送</button>
    </form>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/party-client.js"></script>
    <script type="module" src="/js/bgm.js"></script>
  </body>
</html>
