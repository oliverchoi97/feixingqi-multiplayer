services:
  - type: web
    name: fei-xing-qi
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Set the value in the Render dashboard. Enables /song YouTube search.
      - key: YOUTUBE_API_KEY
        sync: false
